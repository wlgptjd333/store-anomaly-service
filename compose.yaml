# 서비스 5개: django · fastapi · celery · redis · postgres
# 실행: cp .env.example .env (값 수정) → docker compose up -d --build
# 서비스끼리는 localhost 가 아니라 서비스 이름(postgres, redis, fastapi)으로 부른다.

# Django 와 FastAPI 가 같이 써야 하는 값 (한쪽만 바뀌면 업로드는 받았는데 AI 가 거절하는 식으로 어긋남)
x-shared-limits: &shared-limits
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
  UNCERTAIN_BELOW: ${UNCERTAIN_BELOW:-0.3}
  VIDEO_EXTENSIONS: ${VIDEO_EXTENSIONS:-.mp4,.mov,.avi,.mkv,.webm}

x-backend-env: &backend-env
  <<: *shared-limits
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-store_anomaly}
  POSTGRES_USER: ${POSTGRES_USER:-store_anomaly}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  FASTAPI_URL: http://fastapi:8001
  MEDIA_ROOT: /app/media
  IPWEBCAM_CAMERAS: ${IPWEBCAM_CAMERAS:-}              # 처음 migrate 때 카메라 표로 옮기는 초기값
  CAMERA_ALLOWED_NETWORKS: ${CAMERA_ALLOWED_NETWORKS:-192.168.0.0/16,10.0.0.0/8}
  CAPTURE_SECONDS: ${CAPTURE_SECONDS:-8}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store_anomaly}
      POSTGRES_USER: ${POSTGRES_USER:-store_anomaly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data          # 컨테이너를 지워도 DB 는 남는다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  fastapi:
    build:                          # 학습 코드(training/src)도 같이 넣어야 해서 저장소 맨 위에서 빌드
      context: .
      dockerfile: ai_service/Dockerfile   # 넣는 파일은 ai_service/Dockerfile.dockerignore 가 정함
    environment: *shared-limits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8001/health'))['status']=='ok' else 1)"]
      interval: 10s
      start_period: 40s
      retries: 10
    ports:
      - "127.0.0.1:8001:8001"                    # 개발용 /docs 확인. 이 컴퓨터에서만 열림
    restart: unless-stopped

  django:
    build: ./backend
    environment: *backend-env
    volumes:
      - media:/app/media
      - ./exports:/app/exports                   # manage.py export_clips 결과 (Git 제외, 얼굴이 나올 수 있음)
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  celery:
    build: ./backend
    command: celery -A config worker -l info --concurrency 2
    environment: *backend-env
    volumes:
      - media:/app/media                         # Django 가 저장한 업로드 영상을 같은 경로로 읽는다
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      fastapi: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  media:
